 <!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Patients Overview - Dr. Khalid</title>

    <!-- Unified styles -->
     
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="patients-page">
      <!-- Sidebar -->
      <aside class="sidebar" id="sidebar" role="navigation" aria-label="Main navigation">
        <div class="sidebar-profile">
          <img src="img/Doctor.svg" alt="Dr. Khalid profile picture" />
          <span class="doctor-name">Dr. Khalid</span>
        </div>

        <nav class="sidebar-menu">
          <a href="#patients" class="menu-item active">
            <img src="img/patients icon.svg"/>
            <span>Patients</span>
          </a>
          <a href="#profile" class="menu-item">
            <img src="img/stethoscope.svg"/>
            <span>Profile</span>
            </a>
          <a href="#logout" class="menu-item">
            <img src="img/logout.svg"/>
            <span> Logout</span>
           </a>
        </nav>
      </aside>

      <!-- Main Content -->
      <main class="patients-content">
        <header class="patients-header">
          <h1>Patients Overview</h1>
          <p>Select a patient to manage assessments or view monitoring data</p>

          <div class="patients-actions">
            <input
              type="search"
              class="search-input"
              placeholder="Search patient by ID"
              aria-label="Search patient by ID"
            />

            <button class="btn btn-primary">
              <img src="img/addPatient.svg"/>
              <span>Add Patient</span></button>
          </div>
        </header>

        <!-- Patients Grid -->
        <section class="patients-grid">
          <!-- Patient Card -->
          <article class="patient-card">
            <button class="btn btn-secondary">View Patient</button>

            <div class="patient-info">
              <img src="img/male pic.svg" alt="Saleh Al-Otaibi" />
              <div>
                <h2 class="patient-name">Saleh Al-Otaibi</h2>
                <span class="patient-id">P-1033</span>
              </div>
            </div>

            <span class="patient-status severe">Severe</span>
          </article>

          <article class="patient-card">
            <button class="btn btn-secondary">View Patient</button>

            <div class="patient-info">
              <img src="img/male pic.svg" alt="Ahmed Al-Qahtani" />
              <div>
                <h2 class="patient-name">Ahmed Al-Qahtani</h2>
                <span class="patient-id">P-1023</span>
              </div>
            </div>

            <span class="patient-status moderate">Moderate</span>
          </article>

          <article class="patient-card">
            <button class="btn btn-secondary">View Patient</button>

            <div class="patient-info">
              <img src="img/female.svg" alt="Sara Al-Mutiri" />
              <div>
                <h2 class="patient-name">Sara Al-Mutiri</h2>
                <span class="patient-id">P-1043</span>
              </div>
            </div>

            <span class="patient-status mild">Mild</span>
          </article>

          <!-- باقي الكروت نفس الشكل 👆 -->
        </section>
      </main>
    </div>
    <script>
  const sidebar = document.getElementById("sidebar");

  sidebar.addEventListener("click", (e) => {
    // لا تطوي السايدبار إذا ضغطنا على لينك
    if (e.target.closest("a")) return;

    sidebar.classList.toggle("collapsed");
  });
</script>
  </body>
</html>

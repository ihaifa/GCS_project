<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>View Monitoring</title>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="layout" id="layout">

    <!-- Sidebar (نفس واجهتك: مفتوح افتراضيًا) -->
    <aside class="sidebar" id="sidebar" aria-label="Sidebar navigation">
      <div class="profile">
        <div class="avatar">
          <img src="https://i.pravatar.cc/120?img=12" alt="Doctor avatar">
        </div>
        <div class="profile-text">
          <div class="name">Dr.Khlid</div>
        </div>
      </div>

      <nav class="nav">
        <a class="nav-item active" href="#" aria-label="Patients">
          <i class="fa-regular fa-user icon"></i>
          <span>Patients</span>
        </a>

        <a class="nav-item" href="#" aria-label="Profile">
          <i class="fa-regular fa-id-badge icon"></i>
          <span>Profile</span>
        </a>

        <a class="nav-item" href="#" aria-label="Logout">
          <i class="fa-solid fa-right-from-bracket icon"></i>
          <span>Logout</span>
        </a>
      </nav>
    </aside>

    <!-- Main -->
    <main class="main">
      <div class="content">

        <header class="header">
          <h1 class="title">View Monitoring</h1>
          <p class="subtitle">This report and video display the latest update from the past 24 hours.</p>
        </header>

        <!-- Video card (بنفس فكرة الصورة: كرت كبير وفيديو مو full) -->
        <section class="card">
          <div class="video-frame">
            <video controls poster="https://images.unsplash.com/photo-1580281657527-47f249e8f6a8?auto=format&fit=crop&w=1200&q=60">
              <source src="" type="video/mp4">
              Your browser does not support the video tag.
            </video>
          </div>
        </section>

        <!-- Table -->
        <section class="section">
          <h2 class="section-title">Recorded Motions</h2>

          <div class="table-wrap">
            <table class="table" aria-label="Recorded motions table">
              <thead>
                <tr>
                  <th>Video Timestamp</th>
                  <th>Movement Detected</th>
                </tr>
              </thead>
              <tbody id="motionsTbody">
                <tr><td>00:03:14</td><td>Head Turn Left</td></tr>
                <tr><td>00:05:34</td><td>Eyes Opened</td></tr>
                <tr><td>00:07:54</td><td>Right Arm Raised</td></tr>
                <tr><td>00:09:19</td><td>Head Turn Left</td></tr>
              </tbody>
            </table>
          </div>

          <div class="actions">
            <button class="btn" id="exportBtn" type="button">Export</button>
          </div>
        </section>

      </div>
    </main>

  </div>

  <script src="app.js"></script>
</body>
</html>
